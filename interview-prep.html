<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Interview Prep & Practice — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">🤖</span>
        <span class="gradient-text" style="font-weight:800;">AI Internship Engine</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="student-dashboard.html">📊 Dashboard</a></li>
        <li class="menu-item"><a href="internships.html">💼 Internships Marketplace</a></li>
        <li class="menu-item active"><a href="interview-prep.html">🎓 AI Interview Prep</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>AI Interview Preparation & Practice</h1>
      </div>

      <div class="glass-card" style="margin-bottom:2rem;">
        <h3 style="font-size:1.2rem; margin-bottom:1rem;">Select Target Interview Role</h3>
        <select id="interview-role-select" class="form-select" style="max-width:400px;">
          <option value="software">Software Engineer / Java Backend</option>
          <option value="data">Data Science / ML Engineer</option>
        </select>
      </div>

      <div id="interview-questions-list" style="display:flex; flex-direction:column; gap:1.25rem;">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <script src="js/seed-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
      document.getElementById('interview-role-select').addEventListener('change', () => renderQuestions());
    });

    function renderQuestions() {
      const questions = window.interviewManager.getQuestionsForRole('software');
      const container = document.getElementById('interview-questions-list');

      container.innerHTML = questions.map((q, idx) => `
        <div class="glass-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
            <span class="badge badge-accent">Question ${idx+1} • ${q.category}</span>
            <button class="btn btn-secondary" onclick="toggleAnswer('ans-${idx}')">Show Sample Answer</button>
          </div>
          <h3 style="font-size:1.15rem; margin-bottom:1rem;">${Utils.escapeHTML(q.question)}</h3>

          <div id="ans-${idx}" style="display:none; background:rgba(0,0,0,0.25); padding:1rem; border-radius:var(--radius-sm); border-left:3px solid var(--accent-cyan); font-size:0.9rem; color:var(--text-secondary);">
            <strong>Recommended Technical Answer Strategy:</strong><br/>
            ${Utils.escapeHTML(q.sampleAnswer)}
          </div>
        </div>
      `).join('');
    }

    function toggleAnswer(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }
  </script>
</body>
</html>
