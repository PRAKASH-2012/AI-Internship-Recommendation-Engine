<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Recommendation Feed — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/internship.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">🤖</span>
        <span class="gradient-text" style="font-weight:800;">AI Internship Engine</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="student-dashboard.html">📊 Dashboard</a></li>
        <li class="menu-item"><a href="internships.html">💼 Internships Marketplace</a></li>
        <li class="menu-item active"><a href="recommendations.html">🎯 AI Recommendation Feed</a></li>
        <li class="menu-item"><a href="skill-gap.html">⚡ Skill Gap Analyzer</a></li>
        <li class="menu-item"><a href="career.html">�️ Career Roadmap</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <div>
          <h1>Personalized Recommendation Feed</h1>
          <p style="color:var(--text-secondary); font-size:0.9rem;">Categorized feed tailored to your target skills & preferences.</p>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button id="btn-voice-search" class="btn btn-secondary">🎙 Voice Search</button>
          <button id="btn-refresh-feed" class="btn btn-primary">🔄 Refresh Feed</button>
        </div>
      </div>

      <div style="margin-bottom:2.5rem;">
        <h2 style="font-size:1.4rem; margin-bottom:1rem; color:var(--accent-cyan);">🔥 Top Matches for Software Developer</h2>
        <div id="top-matches-feed" class="internship-list">
          <!-- Rendered via JS -->
        </div>
      </div>
    </main>
  </div>

  <script src="js/seed-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/recommendation-engine.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/voice-search.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function renderRecommendations() {
      const student = await window.dbManager.get('students', 'std-1');
      const internships = await window.dbManager.getAll('internships');
      const ranked = await window.recommendationEngine.rankInternshipsForStudent(student, internships);

      const container = document.getElementById('top-matches-feed');
      container.innerHTML = ranked.map(item => `
        <div class="glass-card internship-card">
          <div style="display:flex; gap:1.25rem;">
            <img src="${item.companyLogo || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=150&q=80'}" class="company-logo" alt="Logo" />
            <div>
              <h3 style="font-size:1.2rem;">${Utils.escapeHTML(item.role)}</h3>
              <div style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:0.4rem;">
                ${Utils.escapeHTML(item.companyName)} • ${Utils.escapeHTML(item.location)} (${item.workMode})
              </div>
              <div style="font-size:0.85rem; color:var(--accent-warning); margin-bottom:0.5rem;">
                ${item.matchDetails.why[0] || 'Matches core profile'}
              </div>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between;">
            <span class="badge badge-success" style="font-size:1rem; padding:0.4rem 0.8rem;">${item.matchScore}% Match</span>
            <a href="internship-details.html?id=${item.id}" class="btn btn-primary">View Match</a>
          </div>
        </div>
      `).join('');
    }

    // Voice Search
    document.getElementById('btn-voice-search').addEventListener('click', () => {
      if (window.voiceSearch) {
        window.voiceSearch.startListening((transcript) => {
          document.location.href = `internships.html?search=${encodeURIComponent(transcript)}`;
        });
      }
    });

    // Refresh Feed
    document.getElementById('btn-refresh-feed').addEventListener('click', () => {
      renderRecommendations();
      Utils.showToast('Feed refreshed!', 'success');
    });

    document.addEventListener('DOMContentLoaded', async () => {
      setTimeout(renderRecommendations, 300);
    });
  </script>
</body>
</html>
