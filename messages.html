<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">🤖</span>
        <span class="gradient-text" style="font-weight:800;">AI Internship Engine</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="student-dashboard.html">📊 Dashboard</a></li>
        <li class="menu-item"><a href="internships.html">💼 Marketplace</a></li>
        <li class="menu-item active"><a href="messages.html">� Messages</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>Recruiter Messages</h1>
      </div>

      <div class="glass-card" style="display:grid; grid-template-columns: 240px 1fr; height:450px; padding:0; overflow:hidden;">
        <div style="border-right:1px solid var(--border-color); padding:1rem;">
          <div style="font-weight:600; margin-bottom:1rem;">Conversations</div>
          <div style="background:var(--accent-light); padding:0.75rem; border-radius:var(--radius-sm); border:1px solid var(--border-accent);">
            <div style="font-weight:600; font-size:0.9rem;">TechPulse Labs</div>
            <div style="font-size:0.75rem; color:var(--text-secondary);">Interview invitation details...</div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; justify-content:space-between;">
          <div style="padding:1rem; border-bottom:1px solid var(--border-color); font-weight:600;">
            Sarah Jenkins (TechPulse Labs)
          </div>
          <div style="flex:1; padding:1rem; display:flex; flex-direction:column; gap:0.75rem;">
            <div class="chat-bubble chat-ai">Hi Alex, we reviewed your microservices project and would love to schedule a technical interview!</div>
          </div>
          <div style="padding:1rem; border-top:1px solid var(--border-color); display:flex; gap:0.5rem;">
            <input type="text" class="form-input" placeholder="Type message..." />
            <button class="btn btn-primary">Send</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/aiService.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
