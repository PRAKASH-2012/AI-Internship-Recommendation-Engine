<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Verification — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">⚙️</span>
        <span class="gradient-text" style="font-weight:800;">Admin Console</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="admin-dashboard.html">📊 Overview</a></li>
        <li class="menu-item"><a href="user-management.html">👥 User Management</a></li>
        <li class="menu-item active"><a href="company-management.html">🏢 Company Verification</a></li>
        <li class="menu-item"><a href="fraud-monitoring.html">🛡️ Fraud Monitoring</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>Company Entity Verification Panel</h1>
      </div>

      <div class="glass-card">
        <table style="width:100%; border-collapse:collapse; text-align:left;">
          <thead>
            <tr style="border-bottom:1px solid var(--border-color); color:var(--text-muted);">
              <th style="padding:0.85rem;">Company Name</th>
              <th style="padding:0.85rem;">Industry</th>
              <th style="padding:0.85rem;">Location</th>
              <th style="padding:0.85rem;">Trust Score</th>
              <th style="padding:0.85rem;">Status</th>
              <th style="padding:0.85rem;">Action</th>
            </tr>
          </thead>
          <tbody id="company-verification-rows">
            <!-- Rendered via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/seed-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      setTimeout(async () => {
        const companies = await window.dbManager.getAll('companies');
        const container = document.getElementById('company-verification-rows');

        container.innerHTML = companies.map(c => `
          <tr style="border-bottom:1px solid var(--border-color);">
            <td style="padding:0.85rem; font-weight:600;">${Utils.escapeHTML(c.name)}</td>
            <td style="padding:0.85rem; color:var(--text-secondary);">${Utils.escapeHTML(c.industry)}</td>
            <td style="padding:0.85rem;">${Utils.escapeHTML(c.location)}</td>
            <td style="padding:0.85rem;"><span class="badge ${c.trustScore > 70 ? 'badge-success' : 'badge-error'}">${c.trustScore} / 100</span></td>
            <td style="padding:0.85rem;">
              <span class="badge ${c.isVerified ? 'badge-success' : 'badge-warning'}">${c.isVerified ? 'Verified' : 'Unverified'}</span>
            </td>
            <td style="padding:0.85rem;">
              ${!c.isVerified ? `<button class="btn btn-primary" onclick="Utils.showToast('Company Verified!', 'success')" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Verify Entity</button>` : '—'}
            </td>
          </tr>
        `).join('');
      }, 300);
    });
  </script>
</body>
</html>
