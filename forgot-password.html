<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Simulation</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="glass-card auth-card">
      <div class="auth-header">
        <h2 style="font-size:1.6rem;">Reset Password</h2>
        <p style="color:var(--text-secondary); font-size:0.9rem;">Enter your registered email for password recovery OTP simulation.</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" placeholder="alex.chen@university.edu" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Security Code</button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem;">
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', (e) => {
      e.preventDefault();
      Utils.showToast('Security Code sent to your email (Simulated OTP: 849201)', 'success');
      setTimeout(() => window.location.href = 'verify-account.html', 1200);
    });
  </script>
</body>
</html>
