<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Pathways — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">🤖</span>
        <span class="gradient-text" style="font-weight:800;">AI Internship Engine</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="student-dashboard.html">📊 Dashboard</a></li>
        <li class="menu-item"><a href="internships.html">💼 Internships Marketplace</a></li>
        <li class="menu-item active"><a href="career.html">🗺️ Career Roadmap</a></li>
        <li class="menu-item"><a href="learning-roadmap.html">📚 Skill Roadmap</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>Tech Career Pathway Matcher</h1>
        <div style="display:flex; gap:0.5rem;">
          <button id="btn-voice-search" class="btn btn-secondary">🎙 Voice Search</button>
          <button id="btn-view-guide" class="btn btn-primary">📖 Career Guide</button>
        </div>
      </div>

      <div id="career-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:1.5rem;">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <script src="js/seed-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/career-engine.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/voice-search.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Voice Search for Career Paths
    document.getElementById('btn-voice-search').addEventListener('click', () => {
      if (window.voiceSearch) {
        window.voiceSearch.startListening((transcript) => {
          Utils.showToast(`Searching for career path: ${transcript}`, 'info');
        });
      }
    });

    // Career Guide
    document.getElementById('btn-view-guide').addEventListener('click', () => {
      Utils.showToast('📖 Career progression: Junior → Senior → Lead → Architect', 'info');
    });

    document.addEventListener('DOMContentLoaded', async () => {
      setTimeout(async () => {
        const student = await window.dbManager.get('students', 'std-1');
        if (student) {
          const matches = window.careerEngine.evaluateCareerMatches(student);
          const grid = document.getElementById('career-grid');

          grid.innerHTML = matches.map(car => `
            <div class="glass-card">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
                <h3 style="font-size:1.15rem;">${Utils.escapeHTML(car.title)}</h3>
                <span class="badge badge-success" style="font-size:0.9rem;">${car.matchPercentage}% Match</span>
              </div>
              <p style="color:var(--text-secondary); font-size:0.9rem; margin-bottom:1rem;">${Utils.escapeHTML(car.description)}</p>
              
              <div style="font-size:0.85rem; color:var(--accent-cyan); font-weight:600; margin-bottom:0.75rem;">
                Est. Stipend: ${car.avgSalary}
              </div>

              <div style="font-size:0.85rem; margin-bottom:0.5rem; color:var(--text-muted);">Key Skills Required:</div>
              <div>
                ${car.keySkills.map(s => `<span class="skill-tag">${Utils.escapeHTML(s)}</span>`).join('')}
              </div>
            </div>
          `).join('');
        }
      }, 300);
    });
  </script>
</body>
</html>
