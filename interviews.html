<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Interviews — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">🏢</span>
        <span class="gradient-text" style="font-weight:800;">Recruiter Portal</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="company-dashboard.html">📊 Dashboard</a></li>
        <li class="menu-item active"><a href="interviews.html">📅 Schedule Interviews</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>Schedule & Manage Candidate Interviews</h1>
      </div>

      <div class="glass-card" style="margin-bottom:2rem;">
        <h3 style="margin-bottom:1rem;">Schedule New Technical Interview</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Candidate Name</label>
            <input type="text" class="form-input" value="Alex Chen" />
          </div>
          <div class="form-group">
            <label class="form-label">Interview Date & Time</label>
            <input type="text" class="form-input" value="2026-08-12 at 14:00 EST" />
          </div>
          <div class="form-group">
            <label class="form-label">Meeting Link</label>
            <input type="text" class="form-input" value="https://meet.google.com/demo-techpulse-interview" />
          </div>
          <div class="form-group">
            <label class="form-label">Interviewer</label>
            <input type="text" class="form-input" value="Sarah Jenkins (Lead Architect)" />
          </div>
        </div>
        <button onclick="Utils.showToast('Interview invitation dispatched to Alex Chen!', 'success')" class="btn btn-primary">Send Interview Invite</button>
      </div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/interview.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
