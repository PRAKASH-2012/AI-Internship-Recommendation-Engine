<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications Tracker — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">🤖</span>
        <span class="gradient-text" style="font-weight:800;">AI Internship Engine</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="student-dashboard.html">📊 Dashboard</a></li>
        <li class="menu-item"><a href="internships.html">💼 Internships Marketplace</a></li>
        <li class="menu-item active"><a href="applications.html">📝 Applications Tracker</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>Applications Status Tracker</h1>
        <div style="display:flex; gap:0.5rem;">
          <button id="btn-export-apps" class="btn btn-secondary">📥 Export</button>
          <button id="btn-notifications" class="btn btn-secondary">🔔 Notifications</button>
        </div>
      </div>

      <div id="apps-list-container" style="display:flex; flex-direction:column; gap:1.25rem;">
        <!-- Rendered via JS -->
      </div>
    </main>
  </div>

  <script src="js/seed-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/export.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Export Applications
    document.getElementById('btn-export-apps').addEventListener('click', async () => {
      const apps = await window.dbManager.filter('applications', a => a.studentId === 'std-1');
      const csvContent = 'Company,Role,Status,Applied Date\n' + 
        apps.map(a => `${a.companyName},${a.role},${a.status},${a.appliedDate}`).join('\n');
      
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `applications-${Date.now()}.csv`;
      a.click();
      Utils.showToast('Applications exported as CSV!', 'success');
    });

    // Notifications
    document.getElementById('btn-notifications').addEventListener('click', async () => {
      const notifs = await window.notificationManager.fetchUserNotifications('std-1');
      const unread = notifs.filter(n => !n.read);
      Utils.showToast(`You have ${unread.length} unread notification(s)`, 'info');
    });

    document.addEventListener('DOMContentLoaded', async () => {
      setTimeout(async () => {
        const apps = await window.dbManager.filter('applications', a => a.studentId === 'std-1');
        const container = document.getElementById('apps-list-container');

        if (apps.length === 0) {
          container.innerHTML = `<div class="glass-card">No active applications found. Explore the marketplace to apply!</div>`;
          return;
        }

        container.innerHTML = apps.map(app => `
          <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
              <div>
                <h3 style="font-size:1.2rem;">${Utils.escapeHTML(app.role)}</h3>
                <div style="color:var(--text-secondary); font-size:0.9rem;">${Utils.escapeHTML(app.companyName)} • Applied on ${app.appliedDate}</div>
              </div>
              <span class="badge ${app.status === 'Shortlisted' ? 'badge-success' : 'badge-info'}" style="font-size:0.9rem; padding:0.4rem 0.8rem;">
                ${app.status}
              </span>
            </div>

            <div style="border-top:1px solid var(--border-color); padding-top:1rem; margin-top:1rem;">
              <h4 style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.5rem; text-transform:uppercase;">Timeline History:</h4>
              <div style="display:flex; flex-direction:column; gap:0.4rem; font-size:0.88rem; color:var(--text-secondary);">
                ${(app.timeline || []).map(t => `<div>⏱ <strong>${t.status}</strong> (${t.date}): ${Utils.escapeHTML(t.note)}</div>`).join('')}
              </div>
            </div>
          </div>
        `).join('');
      }, 300);
    });
  </script>
</body>
</html>
