<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — AI Engine</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span style="font-size:1.5rem;">⚙️</span>
        <span class="gradient-text" style="font-weight:800;">Admin Console</span>
      </div>
      <ul class="sidebar-menu">
        <li class="menu-item"><a href="admin-dashboard.html">📊 Overview</a></li>
        <li class="menu-item active"><a href="user-management.html">👥 User Management</a></li>
        <li class="menu-item"><a href="company-management.html">🏢 Company Verification</a></li>
        <li class="menu-item"><a href="fraud-monitoring.html">�️ Fraud Monitoring</a></li>
        <li class="menu-item"><a href="settings.html">⚙️ Settings & DB Backup</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <h1>User Account Administration</h1>
      </div>

      <div class="glass-card">
        <table style="width:100%; border-collapse:collapse; text-align:left;">
          <thead>
            <tr style="border-bottom:1px solid var(--border-color); color:var(--text-muted);">
              <th style="padding:0.85rem;">Name</th>
              <th style="padding:0.85rem;">Email</th>
              <th style="padding:0.85rem;">Role</th>
              <th style="padding:0.85rem;">Status</th>
              <th style="padding:0.85rem;">Action</th>
            </tr>
          </thead>
          <tbody id="user-rows-container">
            <!-- Rendered via JS -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/seed-data.js"></script>
  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      setTimeout(async () => {
        const users = await window.dbManager.getAll('users');
        const container = document.getElementById('user-rows-container');

        container.innerHTML = users.map(u => `
          <tr style="border-bottom:1px solid var(--border-color);">
            <td style="padding:0.85rem; font-weight:600;">${Utils.escapeHTML(u.name)}</td>
            <td style="padding:0.85rem; color:var(--text-secondary);">${Utils.escapeHTML(u.email)}</td>
            <td style="padding:0.85rem;"><span class="badge badge-accent">${u.role.toUpperCase()}</span></td>
            <td style="padding:0.85rem;"><span class="badge badge-success">Active</span></td>
            <td style="padding:0.85rem;">
              <button class="btn btn-secondary" onclick="Utils.showToast('User account updated!', 'info')" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Edit</button>
            </td>
          </tr>
        `).join('');
      }, 300);
    });
  </script>
</body>
</html>
